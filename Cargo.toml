[package]
name = "semi_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
iced = { version = "0.14.0", features = ["tokio", "debug" ]}
iced_futures = "0.14.0"
nvim-rs = { version = "0.9.2", features = ["use_tokio"]}
rmpv = "1.3.1"
tokio = { version = "1.49.0", features = ["full"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[features]
debug = ["iced/hot"]
